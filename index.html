<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Story Maker ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Georgia,serif;
  background:linear-gradient(135deg,#fff1f5,#ffe0ea,#fff);
  color:#5a2635;
  min-height:100vh;
  padding:25px 15px;
}

.container{
  width:min(700px,100%);
  margin:auto;
}

.card{
  background:rgba(255,255,255,.9);
  border-radius:28px;
  padding:30px 22px;
  margin:20px 0;
  box-shadow:0 15px 50px rgba(100,30,60,.15);
}

.logo{
  text-align:center;
  font-size:55px;
  margin-bottom:10px;
}

h1{
  text-align:center;
  font-size:38px;
  margin-bottom:12px;
}

h2{
  font-size:25px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  line-height:1.7;
  color:#76505c;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin:20px 0 8px;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border:1px solid #e8bccb;
  border-radius:15px;
  font-size:16px;
  font-family:inherit;
  background:#fffafd;
  outline:none;
}

textarea{
  min-height:130px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#d94b76;
}

.option-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  border:2px solid #f0ccd7;
  border-radius:15px;
  padding:15px;
  text-align:center;
  cursor:pointer;
  background:#fff;
}

.option input{
  display:none;
}

.option.selected{
  border-color:#d94b76;
  background:#fff0f5;
}

button{
  width:100%;
  border:0;
  border-radius:30px;
  padding:15px;
  margin-top:25px;
  background:#d94b76;
  color:white;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(217,75,118,.25);
}

button:hover{
  transform:translateY(-1px);
}

.counter{
  text-align:right;
  font-size:13px;
  margin-top:5px;
  color:#9b6675;
}

.preview{
  display:none;
  text-align:center;
}

.preview-name{
  font-size:42px;
  color:#d94b76;
  margin:15px 0;
}

.success{
  background:#fff0f5;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
  line-height:1.7;
}

.hidden{
  display:none;
}

@media(max-width:500px){
  h1{font-size:30px}
  .option-box{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

  <!-- SETUP PAGE -->

  <div id="setup">

    <div class="card">

      <div class="logo">💌</div>

      <h1>Create Your Love Story</h1>

      <p class="subtitle">
        Make a little surprise for the person you love.
        Fill in the details below and we'll personalize
        the whole experience for you. ❤️
      </p>


      <h2>1. Tum kaun ho?</h2>

      <div class="option-box">

        <label class="option" id="maleBox">
          <input type="radio"
                 name="senderGender"
                 value="male"
                 onchange="selectOption('male')">
          👨 Male
        </label>

        <label class="option" id="femaleBox">
          <input type="radio"
                 name="senderGender"
                 value="female"
                 onchange="selectOption('female')">
          👩 Female
        </label>

      </div>


      <label>2. Kisko bhejna hai?</label>

      <select id="relationship" onchange="updateRelationship()">

        <option value="">Select relationship</option>

        <option value="girlfriend">
          Girlfriend
        </option>

        <option value="boyfriend">
          Boyfriend
        </option>

        <option value="wife">
          Wife
        </option>

        <option value="husband">
          Husband
        </option>

      </select>


      <label>3. Uska naam kya hai?</label>

      <input
        id="name"
        type="text"
        placeholder="Example: Kavya"
        maxlength="40"
      >


      <label>
        4. Jo tum kehna chahte ho,
        par bol nahi pa rahe... ❤️
      </label>

      <textarea
        id="message"
        maxlength="100"
        placeholder="Apne dil ki baat likho..."
        oninput="countWords(this)"
      ></textarea>

      <div class="counter">
        <span id="wordCount">0</span>/100 words
      </div>


      <label>
        5. Tum usse kyun pyaar karte ho? ❤️
      </label>

      <textarea
        id="whyLove"
        placeholder="Uski kaunsi baat tumhe sabse zyada pasand hai?"
      ></textarea>


      <label>
        6. Woh tumhari favourite person kyun hai? 🥰
      </label>

      <textarea
        id="favourite"
        placeholder="Uske baare me jo tumhe sabse special lagta hai..."
      ></textarea>


      <label>
        7. Ek secret message 💕
      </label>

      <textarea
        id="secret"
        placeholder="Jo sirf uske liye hai..."
      ></textarea>


      <button onclick="createPreview()">
        Create My Love Story ❤️
      </button>

    </div>

  </div>


  <!-- PREVIEW -->

  <div id="
